<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoWala - Watch & Earn</title>
  <style>
    :root { --bg: #0b1027; --card: #171e3d; --pri: #6c5ce7; --acc: #ffb703; --grn: #00b894; --dim: #a0aec0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: #fff; padding-bottom: 60px; }
    header { background: #111738; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232c58; }
    .logo { font-size: 18px; font-weight: 900; }
    .coin-badge { background: #232c58; border: 1px solid var(--acc); padding: 5px 12px; border-radius: 20px; font-weight: 700; color: var(--acc); font-size: 13px; }
    main { max-width: 500px; margin: auto; padding: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tbtn { flex: 1; padding: 10px; border: none; background: var(--card); color: var(--dim); border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .tbtn.active { background: var(--acc); color: #000; }
    .card { background: var(--card); border: 1px solid #232c58; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .bonus-card { background: linear-gradient(135deg, #1e3c72, #2a5298); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .bbtn { background: var(--acc); color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .vcard { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #232c58; padding: 10px; text-align: center; }
    .vthumb { font-size: 32px; padding: 16px 0; background: #0b1027; border-radius: 8px; margin-bottom: 8px; }
    .wbtn { width: 100%; background: var(--pri); color: #fff; border: none; padding: 8px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 8px; }
    #walletSec, #profileSec { display: none; }
    .wcard { background: #1e295d; border-radius: 14px; padding: 18px; text-align: center; margin-bottom: 16px; }
    .fgrp { margin-bottom: 12px; text-align: left; }
    .fgrp label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--dim); }
    .fgrp input { width: 100%; padding: 10px; background: #0b1027; border: 1px solid #313d74; border-radius: 8px; color: #fff; }
    .act-btn { width: 100%; background: var(--grn); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; }
    .hitem { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #232c58; font-size: 12px; }
    .sbadge { background: #fdcb6e; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99; justify-content: center; align-items: center; padding: 14px; }
    .mcontent { background: var(--card); width: 100%; max-width: 450px; border-radius: 14px; padding: 14px; text-align: center; }
    .vwrap { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
    .vwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">▶ Video<span style="color:var(--acc)">Wala</span></div>
    <div class="coin-badge">🪙 <span id="cb">0</span> Coins</div>
  </header>
  <main>
    <div class="tabs">
      <button id="bVid" class="tbtn active" onclick="tab('v')">🎬 Videos</button>
      <button id="bWal" class="tbtn" onclick="tab('w')">👛 Wallet</button>
      <button id="bPro" class="tbtn" onclick="tab('p')">👤 Profile</button>
    </div>

    <div id="videoSec">
      <div class="bonus-card">
        <div><h4 style="font-size:14px;">🎁 Daily Bonus</h4><p style="font-size:11px;opacity:0.8;">Claim +25 Coins rozana</p></div>
        <button class="bbtn" id="dBtn" onclick="claimDaily()">Claim 25 🪙</button>
      </div>
      <div class="grid">
        <div class="vcard"><div class="vthumb">😂</div><h4>Comedy</h4><button class="wbtn" onclick="play('M7lc1UVf-VE','Comedy')">Dekhein</button></div>
        <div class="vcard"><div class="vthumb">🎵</div><h4>Music</h4><button class="wbtn" onclick="play('kJQP7kiw5Fk','Music')">Dekhein</button></div>
        <div class="vcard"><div class="vthumb">📱</div><h4>Tech</h4><button class="wbtn" onclick="play('dQw4w9WgXcQ','Tech')">Dekhein</button></div>
        <div class="vcard"><div class="vthumb">⭐</div><h4>Facts</h4><button class="wbtn" onclick="play('L_LUpnjgPso','Facts')">Dekhein</button></div>
      </div>
    </div>

    <div id="walletSec">
      <div class="wcard">
        <div style="font-size:12px;color:var(--dim);">TOTAL BALANCE</div>
        <div style="font-size:32px;font-weight:900;color:var(--acc);margin:4px 0;">🪙 <span id="wc">0</span></div>
        <div style="color:var(--grn);font-weight:bold;font-size:14px;">≈ ₹<span id="wr">0.00</span> INR</div>
        <button onclick="add50()" style="margin-top:8px;background:none;border:none;color:var(--dim);text-decoration:underline;font-size:11px;cursor:pointer;">+50 Test Coins Jodein</button>
      </div>
      <div class="card">
        <h4 style="margin-bottom:12px;">Instant UPI Withdrawal</h4>
        <div class="fgrp"><label>UPI ID</label><input type="text" id="uInput" placeholder="example@paytm"></div>
        <div class="fgrp"><label>Coins (Min 50)</label><input type="number" id="aInput" placeholder="50"></div>
        <button class="act-btn" id="subBtn" onclick="doWithdraw()">Withdrawal Request Lagayein</button>
      </div>
      <div class="card"><h4 style="margin-bottom:10px;">History</h4><div id="hList"></div></div>
    </div>

    <div id="profileSec">
      <div class="card" style="text-align:center;">
        <div style="font-size:40px;">👤</div>
        <h3 id="uName">Guest User</h3>
        <p id="uPhone" style="font-size:12px;color:var(--dim);">No Phone</p>
      </div>
      <div class="card">
        <h4 style="margin-bottom:12px;">Profile Details</h4>
        <div class="fgrp"><label>Naam</label><input type="text" id="nInp"></div>
        <div class="fgrp"><label>Phone</label><input type="tel" id="pInp"></div>
        <button class="act-btn" style="background:var(--pri);color:#fff;" onclick="savePro()">Save Profile</button>
      </div>
      <div class="card" style="text-align:center;">
        <h4>📢 Refer & Earn</h4>
        <p style="font-size:12px;color:var(--dim);margin:6px 0 12px;">Share karein aur 50 coins payein</p>
        <button class="act-btn" style="background:#25D366;color:#fff;" onclick="shareRef()">WhatsApp Share</button>
      </div>
    </div>
  </main>

  <div id="vMod" class="modal">
    <div class="mcontent">
      <h4 id="mTitle" style="margin-bottom:8px;"></h4>
      <div class="vwrap"><iframe id="vFrame" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>
      <div id="tTxt" style="font-size:13px;color:var(--acc);margin-bottom:10px;font-weight:bold;"></div>
      <button style="background:#ff4757;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;" onclick="closeP()">Close</button>
    </div>
  </div>

  <script>
    const TG_TOKEN = "8421412686:AAG1f1UWAksJMNh8GFdvtqDFA1i5O49YBgI";
    const TG_CHAT_ID = "8373579881";

    let coins = parseInt(localStorage.getItem('vw_c')) || 0;
    let hist = JSON.parse(localStorage.getItem('vw_h')) || [];
    let prof = JSON.parse(localStorage.getItem('vw_p')) || { n: "Guest User", p: "N/A" };
    let timer, sec = 30;

    function sync() {
      document.getElementById('cb').innerText = coins;
      document.getElementById('wc').innerText = coins;
      document.getElementById('wr').innerText = (coins / 10).toFixed(2);
      document.getElementById('uName').innerText = prof.n;
      document.getElementById('uPhone').innerText = prof.p;
      document.getElementById('nInp').value = prof.n !== "Guest User" ? prof.n : "";
      document.getElementById('pInp').value = prof.p !== "N/A" ? prof.p : "";
    }
    sync(); renderH(); chkBonus();

    function tab(t) {
      document.getElementById('videoSec').style.display = t==='v'?'block':'none';
      document.getElementById('walletSec').style.display = t==='w'?'block':'none';
      document.getElementById('profileSec').style.display = t==='p'?'block':'none';
      document.getElementById('bVid').className = 'tbtn' + (t==='v'?' active':'');
      document.getElementById('bWal').className = 'tbtn' + (t==='w'?' active':'');
      document.getElementById('bPro').className = 'tbtn' + (t==='p'?' active':'');
    }

    function play(id, title) {
      document.getElementById('mTitle').innerText = title;
      document.getElementById('vFrame').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      document.getElementById('vMod').style.display = 'flex';
      sec = 30;
      document.getElementById('tTxt').innerText = `⏳ ${sec}s bache hain...`;
      clearInterval(timer);
      timer = setInterval(() => {
        sec--;
        if(sec > 0) document.getElementById('tTxt').innerText = `⏳ ${sec}s bache hain...`;
        else {
          clearInterval(timer);
          coins += 10;
          localStorage.setItem('vw_c', coins);
          sync();
          document.getElementById('tTxt').innerText = "🎉 10 Coins Jud Gaye!";
        }
      }, 1000);
    }
    function closeP() { clearInterval(timer); document.getElementById('vFrame').src = ""; document.getElementById('vMod').style.display = 'none'; }

    function chkBonus() {
      if(localStorage.getItem('vw_b') === new Date().toDateString()) {
        const b = document.getElementById('dBtn'); b.innerText = "Claimed ✔"; b.disabled = true; b.style.opacity = 0.5;
      }
    }
    function claimDaily() {
      coins += 25;
      localStorage.setItem('vw_c', coins);
      localStorage.setItem('vw_b', new Date().toDateString());
      sync(); chkBonus();
      alert("🎉 +25 Daily Coins Mil Gaye!");
    }

    function add50() {
      coins += 50; localStorage.setItem('vw_c', coins); sync(); alert("+50 Test Coins Jud Gaye!");
    }

    function doWithdraw() {
      const upi = document.getElementById('uInput').value.trim();
      const amt = parseInt(document.getElementById('aInput').value);
      if(!upi.includes('@')) { alert("Sahi UPI ID dalein!"); return; }
      if(isNaN(amt) || amt < 50) { alert("Min withdrawal 50 Coins (₹5) hai!"); return; }
      if(amt > coins) { alert("Paryapt coins nahi hain!"); return; }

      const rs = (amt / 10).toFixed(2);
      const dt = new Date().toLocaleDateString('en-IN');
      const btn = document.getElementById('subBtn');
      btn.disabled = true;
      btn.innerText = "Processing...";

      const text = `📢 *Nayi Withdrawal Request - VideoWala*\n\n` +
                   `👤 *Name:* ${prof.n}\n` +
                   `📱 *Phone:* ${prof.p}\n` +
                   `💳 *UPI:* \`${upi}\`\n` +
                   `🪙 *Coins:* ${amt}\n` +
                   `💰 *Rupees:* ₹${rs}\n` +
                   `📅 *Date:* ${dt}`;

      const url = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

      fetch(url)
        .then(() => {
          coins -= amt;
          localStorage.setItem('vw_c', coins);
          sync();

          hist.unshift({ u: upi, c: amt, r: rs, d: dt, s: "Pending" });
          localStorage.setItem('vw_h', JSON.stringify(hist));
          renderH();

          document.getElementById('uInput').value = "";
          document.getElementById('aInput').value = "";
          btn.disabled = false;
          btn.innerText = "Withdrawal Request Lagayein";

          alert(`🎉 Mubarak! ₹${rs} ki withdrawal request safaltapoorvak lag gayi hai!`);
        })
        .catch(() => {
          btn.disabled = false;
          btn.innerText = "Withdrawal Request Lagayein";
          alert("Request bhejne me dikkat aayi. Kripya dobara koshish karein.");
        });
    }

    function renderH() {
      const el = document.getElementById('hList');
      if(!hist.length) { el.innerHTML = `<p style="font-size:12px;color:var(--dim);text-align:center;">Koi history nahi hai</p>`; return; }
      el.innerHTML = hist.map(x => `
        <div class="hitem">
          <div><strong>₹${x.r}</strong> (${x.c} Coins)<br><span style="color:var(--dim);">${x.u} • ${x.d}</span></div>
          <span class="sbadge">${x.s}</span>
        </div>
      `).join('');
    }

    function savePro() {
      const n = document.getElementById('nInp').value.trim();
      const p = document.getElementById('pInp').value.trim();
      if(!n) { alert("Naam likhein!"); return; }
      prof = { n: n, p: p || "N/A" };
      localStorage.setItem('vw_p', JSON.stringify(prof));
      sync();
      alert("Profile Saved!");
    }

    function shareRef() {
      const t = encodeURIComponent(`VideoWala par video dekh kar paise kamao! Code: VW7890. Link: ${window.location.href}`);
      window.open(`https://api.whatsapp.com/send?text=${t}`, '_blank');
    }
  </script>
</body>
</html>
